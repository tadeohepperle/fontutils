[package]
name = "fontutils"
version = "0.1.0"
edition = "2024"

[dependencies]
etagere = "0.2.15"
fontdue = "0.9.2"
sdfer = { git = "https://github.com/tadeohepperle/sdfer" }
ttf-parser = "0.21.1"

[features]
default = ["slice_len_first"]
# if enabled, slices are (isize, ptr) instead of (ptr, isize)
# Jai needs (isize, ptr) while Odin needs (ptr, isize)
slice_len_first = []


[lib]
name = "fontutils"
crate-type = ["cdylib"]

[profile.release]
lto = true        # does a lot for binary size
codegen-units = 1
opt-level = 3     # does not do too much for binary size
